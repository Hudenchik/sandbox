stages:
  - build
  - deploy

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}
  CHART_NAME: "momo-store"
  CHART_PATH: "./momo-store-chart/"
  RELEASE_NAME: "momo-store"
  LOCAL_REPO_NAME: "sandbox"

build-frontend:
  stage: build
  trigger:
    include: /frontend/.gitlab-ci.yml
    strategy: depend
  only:
    changes:
      - frontend//*

build-backend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  script:
    - echo "test"
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/momo-store-backend:$CI_COMMIT_SHA"
      --build-arg VERSION=$VERSION
      --cache=true
  rules:
    - if: '$SKIP_PIPELINE_BACKEND != "true"'
      when: always
    - when: never