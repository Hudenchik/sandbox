services:
  backend:
    image: ${IMAGE_REGISTRY}/${BACKEND_REPO}:${IMAGE_TAG}
    container_name: my-backend
    pull_policy: always
    restart: always
    env_file:
      - .env
    ports:
      - "8081:8081"
    networks:
      - app-network

  frontend:
    image: ${IMAGE_REGISTRY}/${FRONTEND_REPO}:${IMAGE_TAG}
    container_name: my-frontend
    pull_policy: always
    restart: always
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "8888:8888"
    networks:
      - app-network

networks:
  app-network:

