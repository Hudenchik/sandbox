services:
  backend:
    image: 93.77.164.9:8081/sultanov-backend-docker/sandbox-backend:latest
    container_name: my-backend
    pull_policy: always
    restart: always
    env_file:
      - .env
    ports:
      - "8081:8081"
    networks:
      - app-network

  frontend:
    image: 93.77.164.9:8081/sultanov-frontend-docker/sandbox-frontend:latest
    container_name: my-frontend
    pull_policy: always
    restart: always
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "8888:8888"
    networks:
      - app-network

networks:
  app-network:

