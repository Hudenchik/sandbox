apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-postgres
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: sandbox-postgres }
  template:
    metadata:
      labels: { app: sandbox-postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: {{ .Values.db.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.db.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.db.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.db.name | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: sandbox-postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-postgres
spec:
  selector: { app: sandbox-postgres }
  ports:
    - port: {{ .Values.db.port }}
      targetPort: {{ .Values.db.port }}
