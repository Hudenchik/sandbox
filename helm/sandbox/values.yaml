image:
  tag: latest
  backend: ghcr.io/hudenchik/sandbox-backend
  frontend: ghcr.io/hudenchik/sandbox-frontend

ports:
  backend: 8081
  frontend: 8888
  nodePort: 30080

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

db:
  enabled: true
  host: sandbox-postgres      
  port: 5432
  user: postgres
  password: postgres         
  name: postgres
  sslmode: disable

postgres:
  image: postgres:15-alpine
  storage: 1Gi

ingress:
  enabled: true
  className: nginx


