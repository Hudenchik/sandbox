name: sandbox-ci-cd

on:
  push:
    branches: [main, lab3]      # сузить до [main] — одной строкой
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VERSION: 1.0.${{ github.run_number }}   # сквозная версия на весь пайплайн

jobs:
  # ---------- 1. Сборка и публикация в ghcr.io + Nexus ----------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Реестры
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          REGISTRY="${NEXUS_HOST#http://}"; REGISTRY="${REGISTRY#https://}"; REGISTRY="${REGISTRY%/}"
          case "$REGISTRY" in *:*) ;; *) REGISTRY="$REGISTRY:8081" ;; esac
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Nexus в лабе слушает plain HTTP — иначе login/push упадёт
      - name: Разрешить HTTP-реестр
        run: |
          echo "{\"insecure-registries\":[\"$REGISTRY\"]}" | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker

      - name: Логин в оба реестра
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          NEXUS_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_REPO_PASS }}
        run: |
          echo "$GHCR_PAT"  | docker login ghcr.io      -u "$GITHUB_ACTOR" --password-stdin
          echo "$NEXUS_PASS" | docker login "$REGISTRY"  -u "$NEXUS_USER"   --password-stdin

      - name: Собрать и запушить backend
        run: |
          set -euo pipefail
          NEXUS_IMAGE="$REGISTRY/sultanov-backend-docker/sandbox-backend"
          GHCR_IMAGE="ghcr.io/$OWNER/sandbox-backend"
          docker build --platform linux/amd64 --build-arg VERSION="$VERSION" \
            -f src/backend/Dockerfile \
            -t "$NEXUS_IMAGE:$VERSION" -t "$NEXUS_IMAGE:latest" \
            -t "$GHCR_IMAGE:$VERSION"  -t "$GHCR_IMAGE:latest" .
          docker push "$NEXUS_IMAGE:$VERSION"
          docker push "$NEXUS_IMAGE:latest"
          docker push "$GHCR_IMAGE:$VERSION"
          docker push "$GHCR_IMAGE:latest"

      - name: Собрать и запушить frontend
        run: |
          set -euo pipefail
          NEXUS_IMAGE="$REGISTRY/sultanov-frontend-docker/sandbox-frontend"
          GHCR_IMAGE="ghcr.io/$OWNER/sandbox-frontend"
          docker build --platform linux/amd64 --build-arg VERSION="$VERSION" \
            -f src/frontend/Dockerfile \
            -t "$NEXUS_IMAGE:$VERSION" -t "$NEXUS_IMAGE:latest" \
            -t "$GHCR_IMAGE:$VERSION"  -t "$GHCR_IMAGE:latest" .
          docker push "$NEXUS_IMAGE:$VERSION"
          docker push "$NEXUS_IMAGE:latest"
          docker push "$GHCR_IMAGE:$VERSION"
          docker push "$GHCR_IMAGE:latest"

  # ---------- 2. Деплой через docker compose по ssh/scp ----------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Реестр
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          REGISTRY="${NEXUS_HOST#http://}"; REGISTRY="${REGISTRY#https://}"; REGISTRY="${REGISTRY%/}"
          case "$REGISTRY" in *:*) ;; *) REGISTRY="$REGISTRY:8081" ;; esac
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

      - name: SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"     > ~/.ssh/id_ed25519_ci && chmod 600 ~/.ssh/id_ed25519_ci
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          { echo "Host deploy-target"; echo "  HostName $VM_HOST"; echo "  User $VM_USER";
            echo "  IdentityFile ~/.ssh/id_ed25519_ci"; echo "  StrictHostKeyChecking yes"; } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh deploy-target 'echo connected'

      - name: Скопировать compose и .env
        run: |
          printf 'REGISTRY=%s\nVERSION=%s\n' "$REGISTRY" "$VERSION" > /tmp/deploy.env
          ssh deploy-target 'mkdir -p ~/sandbox'
          scp -q docker-compose.yml deploy-target:~/sandbox/docker-compose.yml
          scp -q /tmp/deploy.env   deploy-target:~/sandbox/.env

      - name: Pull и up
        env:
          NEXUS_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_REPO_PASS }}
        run: |
          # лаба 1 держала 8081/8888 на systemd — освобождаем порты
          ssh deploy-target 'sudo -n systemctl disable --now sandbox-backend.service sandbox-frontend.service || true'
          printf '%s' "$NEXUS_PASS" | ssh deploy-target "docker login '$REGISTRY' -u '$NEXUS_USER' --password-stdin"
          ssh deploy-target 'cd ~/sandbox && docker compose pull && docker compose up -d --remove-orphans && docker compose ps'
