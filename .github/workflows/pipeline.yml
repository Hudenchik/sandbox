name: sandbox-ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Версия для деплоя/отката (пусто = новая сборка)"
        required: false
        default: ""
      REGISTRY_KIND:
        description: "Реестр, из которого тянем образы"
        required: false
        default: nexus
        type: choice
        options:
          - nexus
          - ghcr

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Calculate version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.VERSION }}
        run: |
          V="${INPUT_VERSION:-$(date -u +%Y%m%d-%H%M%S)}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

  build-and-push:
    name: Build and push (Nexus + ghcr.io)
    needs: version
    if: github.event_name == 'push' || inputs.VERSION == ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Registry addresses
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          R="${NEXUS_HOST#http://}"; R="${R#https://}"; R="${R%/}"
          case "$R" in *:*) ;; *) R="$R:8081" ;; esac
          { echo "NEXUS_REGISTRY=$R"
            echo "GHCR_OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"; } >> "$GITHUB_ENV"

      # раннер одноразовый: без этого login/push в HTTP-Nexus падает
      - name: Allow insecure (http) Nexus registry
        run: |
          echo "{\"insecure-registries\":[\"$NEXUS_REGISTRY\"]}" | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker

      - name: Login to registries
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          NEXUS_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_REPO_PASS }}
        run: |
          echo "$GHCR_PAT"   | docker login ghcr.io          -u "$GITHUB_ACTOR" --password-stdin
          echo "$NEXUS_PASS" | docker login "$NEXUS_REGISTRY" -u "$NEXUS_USER"  --password-stdin

      - name: Build and push backend
        run: |
          N="$NEXUS_REGISTRY/sultanov-backend-docker/sandbox-backend"
          G="ghcr.io/$GHCR_OWNER/sandbox-backend"
          docker build --platform linux/amd64 --build-arg VERSION="$VERSION" -f src/backend/Dockerfile \
            -t "$N:$VERSION" -t "$N:latest" -t "$G:$VERSION" -t "$G:latest" .
          for i in "$N:$VERSION" "$N:latest" "$G:$VERSION" "$G:latest"; do docker push "$i"; done

      - name: Build and push frontend
        run: |
          N="$NEXUS_REGISTRY/sultanov-frontend-docker/sandbox-frontend"
          G="ghcr.io/$GHCR_OWNER/sandbox-frontend"
          docker build --platform linux/amd64 --build-arg VERSION="$VERSION" -f src/frontend/Dockerfile \
            -t "$N:$VERSION" -t "$N:latest" -t "$G:$VERSION" -t "$G:latest" .
          for i in "$N:$VERSION" "$N:latest" "$G:$VERSION" "$G:latest"; do docker push "$i"; done

  deploy:
    name: Deploy (docker compose over ssh)
    needs: [version, build-and-push]
    if: |
      !cancelled() && needs.version.result == 'success' && needs.build-and-push.result != 'failure'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REGISTRY_KIND: ${{ inputs.REGISTRY_KIND || 'nexus' }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"     > ~/.ssh/id_ed25519_ci && chmod 600 ~/.ssh/id_ed25519_ci
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: .env + compose to VM
        env:
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$REGISTRY_KIND" = "ghcr" ]; then
            IMAGE_REGISTRY=ghcr.io
            BACKEND_REPO="$OWNER/sandbox-backend"
            FRONTEND_REPO="$OWNER/sandbox-frontend"
          else
            IMAGE_REGISTRY="${NEXUS_HOST#http://}"; IMAGE_REGISTRY="${IMAGE_REGISTRY#https://}"; IMAGE_REGISTRY="${IMAGE_REGISTRY%/}"
            case "$IMAGE_REGISTRY" in *:*) ;; *) IMAGE_REGISTRY="$IMAGE_REGISTRY:8081" ;; esac
            BACKEND_REPO=sultanov-backend-docker/sandbox-backend
            FRONTEND_REPO=sultanov-frontend-docker/sandbox-frontend
          fi
          {
            printf '%s\n' "$APP_ENV_FILE"
            echo "IMAGE_REGISTRY=$IMAGE_REGISTRY"
            echo "IMAGE_TAG=$VERSION"
            echo "VERSION=$VERSION"
            echo "BACKEND_REPO=$BACKEND_REPO"
            echo "FRONTEND_REPO=$FRONTEND_REPO"
          } > "$RUNNER_TEMP/deploy.env"
          echo "IMAGE_REGISTRY=$IMAGE_REGISTRY" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/id_ed25519_ci "$VM" 'mkdir -p ~/sandbox'
          scp -q -i ~/.ssh/id_ed25519_ci docker-compose.yml "$VM:~/sandbox/docker-compose.yml"
          scp -q -i ~/.ssh/id_ed25519_ci "$RUNNER_TEMP/deploy.env" "$VM:~/sandbox/.env"

      - name: Login, pull, up, prune
        env:
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          NEXUS_USER: ${{ secrets.NEXUS_REPO_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_REPO_PASS }}
        run: |
          if [ "$REGISTRY_KIND" = "ghcr" ]; then
            printf '%s' "$GHCR_PAT" | ssh -i ~/.ssh/id_ed25519_ci "$VM" \
              "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          else
            printf '%s' "$NEXUS_PASS" | ssh -i ~/.ssh/id_ed25519_ci "$VM" \
              "docker login '$IMAGE_REGISTRY' -u '$NEXUS_USER' --password-stdin"
          fi
          ssh -i ~/.ssh/id_ed25519_ci "$VM" 'cd ~/sandbox && chmod 600 .env && docker compose pull && docker compose up -d --remove-orphans --force-recreate && docker image prune -f && docker compose ps'

      - name: Health check
        env:
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
        run: |
          for i in $(seq 1 10); do
            if ssh -i ~/.ssh/id_ed25519_ci "$VM" \
               'curl -fsS http://localhost:8081/health >/dev/null && curl -fsS -o /dev/null http://localhost:8888/'; then
              echo "health OK"
              exit 0
            fi
            echo "attempt $i/10 failed, retry in 3s"
            sleep 3
          done
          echo "::error::health check failed"
          ssh -i ~/.ssh/id_ed25519_ci "$VM" 'cd ~/sandbox && docker compose ps; docker compose logs --tail=50' || true
          exit 1
